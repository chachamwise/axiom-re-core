<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333" />
    </marker>
    <style>
      .box { fill: #f9f9f9; stroke: #333; stroke-width: 2px; }
      .sealed { fill: #e6fffa; stroke: #007f5f; stroke-width: 3px; }
      .agent { fill: #fff0f0; stroke: #e03131; stroke-width: 2px; stroke-dasharray: 5,5; }
      .text-title { font-family: Arial, sans-serif; font-weight: bold; font-size: 16px; text-anchor: middle; }
      .text-desc { font-family: Arial, sans-serif; font-size: 12px; text-anchor: middle; fill: #555; }
      .label { font-family: monospace; font-size: 12px; fill: #000; background-color: white; }
    </style>
  </defs>
  <rect x="250" y="20" width="300" height="80" rx="10" class="agent" />
  <text x="400" y="50" class="text-title" fill="#e03131">1. AI AGENT LAYER</text>
  <text x="400" y="70" class="text-desc">(External / Untrusted / Stochastic)</text>
  <line x1="400" y1="100" x2="400" y2="150" stroke="#333" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="410" y="115" width="120" height="20" fill="white" stroke="none"/>
  <text x="470" y="130" class="label" text-anchor="middle">Action (a_t)</text>
  <rect x="250" y="150" width="300" height="100" rx="10" class="box" />
  <text x="400" y="180" class="text-title">2. CONSTITUTIONAL BRIDGE</text>
  <text x="400" y="200" class="text-desc">bridge.py</text>
  <text x="400" y="220" class="text-desc" font-style="italic">"The Gatekeeper"</text>
  <line x1="400" y1="250" x2="400" y2="300" stroke="#333" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="410" y="265" width="140" height="20" fill="white" stroke="none"/>
  <text x="480" y="280" class="label" text-anchor="middle">Project State (s_t+1)</text>
  <rect x="200" y="300" width="400" height="120" rx="10" class="sealed" />
  <text x="400" y="330" class="text-title" fill="#007f5f">3. SEALED PHYSICS KERNEL</text>
  <text x="400" y="350" class="text-desc">core.py</text>
  <rect x="230" y="360" width="340" height="40" fill="#fff" stroke="#007f5f" stroke-width="1" rx="5"/>
  <text x="400" y="385" font-family="Times New Roman, serif" font-size="14px" font-style="italic" text-anchor="middle">Ω: { P_proj &lt; P_limit, Flux = √(ΔP / β) }</text>
  <path d="M380,330 Q380,320 390,320 T400,330 V340 H380 Z" fill="none" stroke="#007f5f" stroke-width="2" />
  <rect x="375" y="335" width="50" height="10" fill="none" /> 
  <path d="M250,200 Q150,200 150,120 Q150,60 250,60" fill="none" stroke="#d63031" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <text x="140" y="140" class="label" fill="#d63031" transform="rotate(-90 140,140)">BLOCKED / ALLOWED</text>
</svg>